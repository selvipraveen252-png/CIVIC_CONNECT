version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: civicconnect-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: civicconnect
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: civicconnect-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civicconnect-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/civicconnect
      - JWT_SECRET=civicconnect_super_secret_jwt_key_2026_academic_demo
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civicconnect-frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
